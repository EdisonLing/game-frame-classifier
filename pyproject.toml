[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-frame-classifier"
version = "0.1.0"
description = "CNN gameplay frame classifier (APS360)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gfc-extract-frames = "game_frame_classifier.frame_extractor:main"
gfc-clean-frames = "game_frame_classifier.frame_cleaner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "personal: uses a local personal clip; skipped unless GFC_TEST_VIDEO is set or default path exists",
]
filterwarnings = ["ignore::DeprecationWarning"]
