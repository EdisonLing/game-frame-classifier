[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-frame-classifier"
version = "0.1.0"
description = "CNN gameplay frame classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["numpy", "torch", "torchvision", "scikit-learn", "matplotlib"]

[project.scripts]
gfc-extract-frames = "game_frame_classifier.frame_extractor:main"
gfc-clean-frames = "game_frame_classifier.frame_cleaner:main"
gfc-encode-quality = "game_frame_classifier.quality_encoder:main"
gfc-catalog-clips = "game_frame_classifier.clip_catalog:main"
gfc-batch-extract = "game_frame_classifier.batch_extract:main"
gfc-frame-export = "game_frame_classifier.frame_export.cli:main"
gfc-ingest-pack = "game_frame_classifier.ingest_pack:main"
gfc-make-sources = "game_frame_classifier.make_sources:main"
gfc-derive-frames = "game_frame_classifier.derive_frames:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "personal: uses a local personal clip; skipped unless GFC_TEST_VIDEO is set or default path exists",
]
filterwarnings = ["ignore::DeprecationWarning"]
